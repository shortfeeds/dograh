services:
  dograh-api:
    image: ghcr.io/dograh-hq/api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dograh:CHANGE_ME_DB_PASS@dograh-postgres:5432/dograh
      REDIS_URL: redis://dograh-redis:6379
      # Telephony & AI Keys
      PLIVO_AUTH_ID: ${PLIVO_AUTH_ID}
      PLIVO_AUTH_TOKEN: ${PLIVO_AUTH_TOKEN}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: llama-3.3-70b-versatile
      DEEPGRAM_MODEL: nova-3
      SARVAM_TTS_MODEL: bulbul-v3
    depends_on:
      - dograh-postgres
      - dograh-redis

  dograh-ui:
    image: ghcr.io/dograh-hq/ui:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://dograh-api:8000
    depends_on:
      - dograh-api

  dograh-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dograh
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASS
      POSTGRES_DB: dograh
    volumes:
      - pgdata:/var/lib/postgresql/data

  dograh-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
